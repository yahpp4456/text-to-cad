<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2"/>
<title>汽缸驅動 末端平面前傾 — 3D 動作模擬</title>
<style>
  :root{ --frame:#9aa0a6; --rocker:#1D9E75; --cyl:#D85A30; --rod:#cfd4da; --coupler:#E0A52E; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden;
    font-family:"Microsoft JhengHei",Arial,sans-serif; background:#9fb0bd; color:#eef2f6; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }
  .panel{ position:fixed; z-index:10; background:rgba(20,26,33,.62);
    backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:14px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.4); }
  #ctrl{ top:14px; left:14px; width:288px; }
  #ctrl h1{ font-size:15px; margin:0 0 4px; font-weight:700; letter-spacing:.3px; }
  #ctrl .sub{ font-size:11px; color:#9fb0bf; margin-bottom:12px; line-height:1.5; }
  .row{ display:flex; align-items:center; gap:10px; margin:10px 0; }
  button{ font:inherit; color:#eef2f6; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18); border-radius:9px; padding:8px 12px;
    cursor:pointer; transition:.15s; user-select:none; }
  button:hover{ background:rgba(255,255,255,.16); }
  button:active{ transform:translateY(1px); }
  #play{ min-width:78px; font-weight:700; }
  input[type=range]{ -webkit-appearance:none; appearance:none; flex:1; height:5px;
    border-radius:4px; background:linear-gradient(90deg,var(--cyl),#f0d18a); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px;
    border-radius:50%; background:#fff; border:2px solid var(--cyl); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%;
    background:#fff; border:2px solid var(--cyl); cursor:pointer; }
  .lab{ font-size:11px; color:#9fb0bf; width:34px; }
  .read{ display:grid; grid-template-columns:1fr auto; gap:5px 10px; font-size:13px;
    margin-top:10px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); }
  .read .k{ color:#9fb0bf; } .read .v{ font-weight:700; font-variant-numeric:tabular-nums; }
  .status{ display:flex; align-items:center; gap:9px; margin-top:12px; font-size:12.5px; }
  #dot{ width:14px; height:14px; border-radius:50%; background:#3ddc84;
    box-shadow:0 0 10px #3ddc84; transition:.2s; }
  #legend{ bottom:14px; left:14px; font-size:12px; }
  #legend .t{ font-weight:700; margin-bottom:8px; font-size:12px; color:#cdd6df; }
  .lg{ display:flex; align-items:center; gap:8px; margin:5px 0; }
  .sw{ width:15px; height:15px; border-radius:4px; border:1px solid rgba(255,255,255,.25); }
  #hint{ top:14px; right:14px; font-size:11px; color:#9fb0bf; max-width:185px; line-height:1.6; }
  @media (max-width:560px){ #ctrl{ width:calc(100% - 28px); } #hint{ display:none; } #legend{ font-size:11px; } }
  /* ===== v3 §7 手機/直式 UI 硬規則（§10.9 可重用片段） ===== */
  .panel{ max-height:calc(100vh - 28px); overflow:auto; }
  .hd{ display:flex; align-items:center; justify-content:space-between; gap:10px;
       cursor:pointer; user-select:none; }
  .hd .chev{ font-size:11px; color:#9fb0bf; transition:transform .15s; }
  .panel.collapsed .body{ display:none; }
  .panel.collapsed .chev{ transform:rotate(-90deg); }
  @media (max-width:560px){
    #ctrl .sub{ display:none; }
    button{ font-size:12px; padding:5px 9px; }
    #ctrl{ max-height:48vh; } #legend{ max-height:38vh; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="ctrl" class="panel">
  <div class="hd"><h1>汽缸驅動 — 末端平面前傾</h1><span class="chev">▾</span></div>
  <div class="sub">機構：滑塊曲柄→搖桿（知識庫 §2-4）<br/>汽缸＝AirTAC MAL25×25（ATOM-CYL，d=10）<br/>DOF = 1 ｜ 驅動變數＝前傾角 θ</div>
  <div class="row">
    <button id="play">▶ 播放</button>
    <button id="resetCam">重設視角</button>
  </div>
  <div class="row"><span class="lab">θ</span>
    <input id="slider" type="range" min="0" max="30" step="0.1" value="0"/></div>
  <div class="body">
    <div class="read">
    <span class="k">前傾角 θ</span><span class="v"><span id="rTheta">0.0</span>°</span>
    <span class="k">缸桿行程</span><span class="v"><span id="rStroke">0.00</span> mm</span>
    <span class="k">缸桿伸出長</span><span class="v"><span id="rRod">25.0</span> mm</span>
    <span class="k">傳動角 μ</span><span class="v"><span id="rMu">90.0</span>°</span>
  </div>
  <div class="status"><span id="dot"></span><span id="sTxt">傳動角順暢 (μ ≥ 45°)</span></div>
  </div>
</div>

<div id="legend" class="panel">
  <div class="hd"><div class="t" style="margin-bottom:0">圖例</div><span class="chev">▾</span></div>
  <div class="body">
  <div class="lg"><span class="sw" style="background:var(--rocker)"></span>搖桿＝末端平面 (輸出)</div>
  <div class="lg"><span class="sw" style="background:var(--cyl)"></span>汽缸 MAL25 (ATOM-CYL，固定水平推)</div>
  <div class="lg"><span class="sw" style="background:var(--coupler)"></span>連桿 coupler (雙圓套)</div>
  <div class="lg"><span class="sw" style="background:#c8ced4"></span>叉耳 / 銷 / 扣環</div>
  <div class="lg"><span class="sw" style="background:var(--frame)"></span>機架 / 鉸鏈座</div>
  </div>
</div>

<div id="hint" class="panel">
  左鍵拖曳：旋轉<br/>右鍵拖曳：平移<br/>滾輪：縮放<br/>拖滑桿即定格該角度
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   1) 純運動學 (與 2D 工程圖、Node 驗證同一組 pin；單位 = mm)
   ===================================================================== */
const O={x:110,y:12}, R=42, HCYL=54, L=35, XBAR=50, PLATE_H=50, ZC=25;
const THETA_MAX=30*Math.PI/180;
const Pp=t=>({x:O.x+R*Math.sin(t), y:O.y+R*Math.cos(t)});
const Cp=t=>{const p=Pp(t),dy=p.y-HCYL; return {x:p.x-Math.sqrt(Math.max(0,L*L-dy*dy)),y:HCYL};};
const rodLen=t=>Cp(t).x-XBAR;  const ROD0=rodLen(0);
const muDeg=t=>{const p=Pp(t),c=Cp(t);
  const ax=O.x-p.x,ay=O.y-p.y,bx=c.x-p.x,by=c.y-p.y;
  let cs=(ax*bx+ay*by)/(Math.hypot(ax,ay)*Math.hypot(bx,by));
  cs=Math.max(-1,Math.min(1,cs)); let d=Math.acos(cs)*180/Math.PI; return d>90?180-d:d;};

/* =====================================================================
   2) 場景 / 相機 / 燈光 / 地面
   ===================================================================== */
const app=document.getElementById('app');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9fb0bd);   // §5.6 明亮灰藍
const camera=new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 4000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12;
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x9aa4ad,1.1));   // §5.6
const sun=new THREE.DirectionalLight(0xffffff,1.0); sun.position.set(120,200,160);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera; sc.left=-120; sc.right=200; sc.top=180; sc.bottom=-60; sc.near=1; sc.far=700;
sun.shadow.bias=-0.0004; scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.28); fill.position.set(-100,90,-120); scene.add(fill);

const grid=new THREE.GridHelper(600,60,0x7c8893,0x6e7a85); grid.position.set(70,0.02,25); scene.add(grid);  // §5.6 亮灰格線
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),
  new THREE.MeshStandardMaterial({color:0x8b97a1,roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2; ground.position.set(70,0,25); ground.receiveShadow=true; scene.add(ground);

/* =====================================================================
   3) 材質 ＋ 建模工具
   ===================================================================== */
const matFrame  =new THREE.MeshStandardMaterial({color:0x9aa0a6,metalness:.55,roughness:.6});
const matRocker =new THREE.MeshStandardMaterial({color:0x1D9E75,metalness:.45,roughness:.45});
const matCyl    =new THREE.MeshStandardMaterial({color:0xD85A30,metalness:.6,roughness:.38});
const matCylDk  =new THREE.MeshStandardMaterial({color:0xae4724,metalness:.6,roughness:.4});
const matRod    =new THREE.MeshStandardMaterial({color:0xdfe3e8,metalness:.95,roughness:.16});
const matCoupler=new THREE.MeshStandardMaterial({color:0xE0A52E,metalness:.55,roughness:.4});
const matClevis =new THREE.MeshStandardMaterial({color:0xb9c0c7,metalness:.82,roughness:.3});
const matPin    =new THREE.MeshStandardMaterial({color:0x515963,metalness:.92,roughness:.26});
const matClip   =new THREE.MeshStandardMaterial({color:0xd7dde2,metalness:.95,roughness:.2});
const matHole   =new THREE.MeshStandardMaterial({color:0x12161b,metalness:.3,roughness:.9});
const matPort   =new THREE.MeshStandardMaterial({color:0x8a6a2a,metalness:.6,roughness:.4});  // 氣口黃銅

function box(w,h,d,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.castShadow=true; m.receiveShadow=true; return m;}
function cylX(r,len,mat,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||28),mat);
  m.rotation.z=-Math.PI/2; m.castShadow=true; m.receiveShadow=true; return m;}      // 軸沿 X
function cylZ(r,len,mat,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||24),mat);
  m.rotation.x=Math.PI/2; m.castShadow=true; m.receiveShadow=true; return m;}        // 軸沿 Z
function cylY(r,len,mat,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||20),mat);
  m.castShadow=true; return m;}                                                      // 軸沿 Y
const matRockerHi=new THREE.MeshStandardMaterial({color:0x2bbf8f,metalness:.5,roughness:.4});
// 圓角矩形 Shape(中心 cx,cy)，供末端平面 ExtrudeGeometry 用
function roundedRectShape(w,h,r,cx,cy){
  const x=cx-w/2, y=cy-h/2; const s=new THREE.Shape();
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
  s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
  s.lineTo(x+r,y+h);   s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(x,y+r);     s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}

// 緊貼銷的「圓頭夾片」一對(沿Z在±zc)，夾住連桿圓套；原點=銷軸。
// 不往外伸長叉,避免兩接頭在中間疊成一坨。背板由母件(桿端本體/平板)負責。
function clevisTabs(mat, r, t){
  r=r||7.5; t=t||5.5; const zc=8; const g=new THREE.Group();
  for(const z of [zc,-zc]){
    const tab=cylZ(r,t,mat,26); tab.position.set(0,0,z); g.add(tab);
    const csk=cylZ(3.4,t+0.4,matHole,18); csk.position.set(0,0,z); g.add(csk); // 孔口暗面
  }
  return g;
}
// 真實 clevis 銷：銷桿 + 扁銷頭(+Z端,倒角) + 扣環 circlip(−Z端)
function makePin(rsh, span, matS, matC){
  const g=new THREE.Group();
  const sl=span+8;                                  // 露出兩側
  g.add(cylZ(rsh, sl, matS, 22));
  const head=cylZ(rsh*1.5, 3.0, matS, 24); head.position.z=sl/2-0.4; g.add(head);
  const ch=new THREE.Mesh(new THREE.CylinderGeometry(rsh,rsh*1.5,1.5,24),matS);
  ch.rotation.x=Math.PI/2; ch.position.z=sl/2-1.9; g.add(ch);
  const clip=new THREE.Mesh(new THREE.TorusGeometry(rsh*1.15,0.9,8,22),matC);
  clip.position.z=-(sl/2-2.4); clip.castShadow=true; g.add(clip);
  return g;
}

/* =====================================================================
   4) 機架 (固定) — 底板(含沉孔) / 缸後支座 / 缸夾 / 鉸鏈雙耳 / 鉸鏈銷O
   ===================================================================== */
const frame=new THREE.Group(); scene.add(frame);
const base=box(146,8,54,matFrame); base.position.set(70,4,25); frame.add(base);
[[14,8],[14,42],[130,8],[130,42]].forEach(([x,z])=>{ const h=cylY(2.4,9,matHole);
  h.position.set(x,5,z); frame.add(h); });
const rearPost=box(14,46,30,matFrame); rearPost.position.set(6,27,25); frame.add(rearPost);
const clampPed=box(16,40,30,matFrame); clampPed.position.set(44,24,25); frame.add(clampPed);
const clampRing=cylX(15.5,9,matFrame,30); clampRing.position.set(44,HCYL,25); frame.add(clampRing);
const lugA=box(13,16,5,matFrame); lugA.position.set(110,16,2.5); frame.add(lugA);
const lugB=box(13,16,5,matFrame); lugB.position.set(110,16,47.5); frame.add(lugB);
const earCapA=cylZ(8,5,matFrame,20); earCapA.position.set(110,O.y,2.5); frame.add(earCapA);
const earCapB=cylZ(8,5,matFrame,20); earCapB.position.set(110,O.y,47.5); frame.add(earCapB);
const pinO=makePin(4,50,matPin,matClip); pinO.position.set(O.x,O.y,ZC); frame.add(pinO);

/* =====================================================================
   5) 汽缸 — AirTAC MAL25×25（原子件 ATOM-CYL-AIRTAC）
      圓體迷你缸，依卡 D=25/d=10：OD=1.18D=29.5(r≈14.75)、端蓋微凸、
      F推@0.5MPa=0.5·π/4·25²≈245N(×0.9≈221N)；行程 25 涵蓋本機構約 21.5mm 桿行程。
      MAL 為滾軋圓體→無方蓋、無外露拉桿（原舊圖示意的 4 拉桿屬 SC 風格，已移除校正）。
   ===================================================================== */
const CYL_D=25, CYL_OD=1.18*CYL_D;                 // 卡值
const barrel =cylX(CYL_OD/2,46,matCyl,36);   barrel.position.set(27,HCYL,ZC); scene.add(barrel);
const rearCap=cylX(CYL_OD*0.56,9,matCylDk,36); rearCap.position.set(5,HCYL,ZC); scene.add(rearCap);
const headCap=cylX(CYL_OD*0.56,9,matCylDk,36); headCap.position.set(49,HCYL,ZC); scene.add(headCap);
const gland  =cylX(7,5,matCylDk,24);          gland.position.set(53.5,HCYL,ZC); scene.add(gland);
// 兩端頂部氣口（MAL 圓體進排氣口）
[8,46].forEach(x=>{ const port=cylY(2.2,7,matPort,16);
  port.position.set(x,HCYL+CYL_OD*0.5+1.5,ZC); scene.add(port); });
const rod=cylX(5,1,matRod,24); rod.position.set(0,HCYL,ZC); scene.add(rod);   // 活塞桿 d=10（卡值，半徑5不變）

/* =====================================================================
   6) 連桿 coupler (兩端圓套 eye + 細桿身) + 桿端 clevis + 銷C
   ===================================================================== */
const coupler=new THREE.Group(); scene.add(coupler);
const eyeC=cylZ(6,9,matCoupler,26); eyeC.position.set(-L/2,0,0); coupler.add(eyeC);
const eyeP=cylZ(6,9,matCoupler,26); eyeP.position.set( L/2,0,0); coupler.add(eyeP);
const shank=box(L-9,7,7,matCoupler); coupler.add(shank);
const shankT=box(L-9,2.2,9,matCoupler); shankT.position.set(0,4.0,0); coupler.add(shankT);
const shankB=box(L-9,2.2,9,matCoupler); shankB.position.set(0,-4.0,0); coupler.add(shankB);

// 桿端 clevis：本體(連到缸桿) + 一對夾片夾住 eyeC ；整組逐格定位於 C
const rodFork=new THREE.Group(); scene.add(rodFork);
const rfBody=box(9,17,21,matClevis); rfBody.position.set(-9,0,0); rodFork.add(rfBody); // 叉耳本體(背板)
const rfNeck=cylX(6,6,matRod,20);    rfNeck.position.set(-14,0,0); rodFork.add(rfNeck); // 接缸桿螺肩
rodFork.add(clevisTabs(matClevis));
const pinCG=makePin(3,24,matPin,matClip); scene.add(pinCG);

/* =====================================================================
   7) 搖桿樞軸階層 (一起轉的剛體同一 Group)  §4.3
   ===================================================================== */
const rockerPivot=new THREE.Group(); rockerPivot.position.set(O.x,O.y,ZC); scene.add(rockerPivot);
// ---- 末端平面：倒角圓邊面板 + 中央定位凸台 + 沉頭安裝孔 + 背肋 + 鉸鏈knuckle ----
const endPlate=new THREE.Group(); rockerPivot.add(endPlate);
const slabGeo=new THREE.ExtrudeGeometry(roundedRectShape(42,52,7,0,27),
  {depth:7,bevelEnabled:true,bevelThickness:0.9,bevelSize:1.1,bevelSegments:2,steps:1});
const slab=new THREE.Mesh(slabGeo,matRocker); slab.rotation.y=Math.PI/2;       // 厚度->+X
slab.castShadow=true; slab.receiveShadow=true; endPlate.add(slab);
// 中心定位凸台(register) + 導孔(pilot bore)
const reg=cylX(9,4,matRockerHi,28);  reg.position.set(7.6,27,0);  endPlate.add(reg);
const pilot=cylX(4.6,15,matHole,20); pilot.position.set(6,27,0);  endPlate.add(pilot);
// 4 個沉頭安裝孔(counterbore + through)
[[40,12],[40,-12],[14,12],[14,-12]].forEach(([y,z])=>{
  const cb=cylX(4.3,3.2,matHole,18); cb.position.set(6.6,y,z); endPlate.add(cb);
  const th=cylX(2.4,12,matHole,16);  th.position.set(4,y,z);   endPlate.add(th);
});
// 背面加強肋(Z外側,避開夾片/連桿) + 底部鉸鏈圓筒
const ribL=box(6,32,4,matRocker); ribL.position.set(-2,24, 15); endPlate.add(ribL);
const ribR=box(6,32,4,matRocker); ribR.position.set(-2,24,-15); endPlate.add(ribR);
const knuckle=cylZ(9,40,matRocker,26); knuckle.position.set(3.5,0,0); endPlate.add(knuckle);
// 平台端 clevis：夾片直接貼在凸台/平板背面夾住 eyeP；隨搖桿旋轉
rockerPivot.add((()=>{ const g=clevisTabs(matClevis); g.position.set(0,R,0); return g; })());
const pinPG=makePin(3,24,matPin,matClip); pinPG.position.set(0,R,0); rockerPivot.add(pinPG);

/* =====================================================================
   8) 末端平面頂緣 tip-path 弧 (運動範圍指示, 虛線)
   ===================================================================== */
const tipPts=[];
for(let i=0;i<=40;i++){const t=THETA_MAX*i/40;
  tipPts.push(new THREE.Vector3(O.x+PLATE_H*Math.sin(t),O.y+PLATE_H*Math.cos(t),ZC));}
const tip=new THREE.Line(new THREE.BufferGeometry().setFromPoints(tipPts),
  new THREE.LineDashedMaterial({color:0x8fa6b6,dashSize:3,gapSize:2.4}));
tip.computeLineDistances(); scene.add(tip);

/* =====================================================================
   9) update(θ) — 唯一驅動：閉式代入
   ===================================================================== */
const I=id=>document.getElementById(id);
function update(theta){
  rockerPivot.rotation.z=-theta;                       // 前傾(CW)=負向
  const p=Pp(theta), c=Cp(theta), rl=rodLen(theta);
  rod.scale.y=rl; rod.position.set(XBAR+rl/2,HCYL,ZC);
  rodFork.position.set(c.x,HCYL,ZC);                   // 桿端clevis在C(背板朝缸)
  coupler.position.set((c.x+p.x)/2,(c.y+p.y)/2,ZC);    // 連桿:中點+轉向 -> 兩套落在C/P
  coupler.rotation.z=Math.atan2(p.y-c.y,p.x-c.x);
  pinCG.position.set(c.x,c.y,ZC);
  const mu=muDeg(theta);
  I('rTheta').textContent=(theta*180/Math.PI).toFixed(1);
  I('rStroke').textContent=(rl-ROD0).toFixed(2);
  I('rRod').textContent=rl.toFixed(1);
  I('rMu').textContent=mu.toFixed(1);
  const dot=I('dot'),txt=I('sTxt'); let col,msg;
  if(mu<30){col='#e5484d';msg='接近卡死 (μ < 30°)';}
  else if(mu<45){col='#f5a524';msg='傳動角偏低 (30–45°)';}
  else{col='#3ddc84';msg='傳動角順暢 (μ ≥ 45°)';}
  dot.style.background=col; dot.style.boxShadow='0 0 10px '+col; txt.textContent=msg;
}

/* =====================================================================
   10) 自寫 minimal orbit
   ===================================================================== */
const target=new THREE.Vector3(70,32,25);
const NARROW=innerWidth<620||innerWidth<innerHeight;
const HOME={r:NARROW?320:235,az:-0.78,pol:1.12}; const sph={...HOME};
function applyCam(){const s=Math.sin(sph.pol);
  camera.position.set(target.x+sph.r*s*Math.sin(sph.az),
    target.y+sph.r*Math.cos(sph.pol), target.z+sph.r*s*Math.cos(sph.az));
  camera.lookAt(target);}
applyCam();
const dom=renderer.domElement; let drag=0,lx=0,ly=0;
dom.addEventListener('pointerdown',e=>{if(e.button===1)e.preventDefault(); drag=e.button===2?2:1; lx=e.clientX; ly=e.clientY;
  dom.setPointerCapture(e.pointerId);});
dom.addEventListener('pointermove',e=>{ if(!drag)return;
  const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(drag===2){ const s=Math.sin(sph.pol);
    const fwd=new THREE.Vector3(s*Math.sin(sph.az),Math.cos(sph.pol),s*Math.cos(sph.az));
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
    const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
    const k=sph.r*0.0016; target.addScaledVector(right,dx*k); target.addScaledVector(up,dy*k);
  } else { sph.az-=dx*0.008; sph.pol=Math.max(0.12,Math.min(Math.PI-0.12,sph.pol-dy*0.008)); }  // v1.4：左鍵水平 -dx
  applyCam();
});
addEventListener('pointerup',()=>drag=0);
dom.addEventListener('wheel',e=>{e.preventDefault();
  sph.r=Math.max(80,Math.min(620,sph.r*(1+Math.sign(e.deltaY)*0.08))); applyCam();
},{passive:false});
dom.addEventListener('contextmenu',e=>e.preventDefault());

/* =====================================================================
   11) UI ＋ ping-pong 迴圈
   ===================================================================== */
let theta=0,dir=1,playing=false,speed=0.6,last=performance.now();
const slider=I('slider'),playBtn=I('play');
function setPlay(p){playing=p; playBtn.textContent=p?'⏸ 暫停':'▶ 播放';}
playBtn.addEventListener('click',()=>setPlay(!playing));
I('resetCam').addEventListener('click',()=>{Object.assign(sph,HOME); target.set(70,32,25); applyCam();});
slider.addEventListener('input',()=>{setPlay(false);
  theta=parseFloat(slider.value)*Math.PI/180; update(theta);});
function loop(now){const dt=(now-last)/1000; last=now;
  if(playing){ theta+=dir*speed*dt;
    if(theta>=THETA_MAX){theta=THETA_MAX;dir=-1;} else if(theta<=0){theta=0;dir=1;}
    slider.value=(theta*180/Math.PI).toFixed(1); update(theta); }
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
/* ===== v3 §7/§10.9 手機 UI：可收合面板＋窄螢幕預設收起 ===== */
function wireCollapse(id){const p=document.getElementById(id);
  p.querySelector('.hd').addEventListener('click',()=>p.classList.toggle('collapsed'));}
['ctrl','legend'].forEach(wireCollapse);
if(innerWidth<560){['ctrl','legend'].forEach(id=>document.getElementById(id).classList.add('collapsed'));}
/* ===== sRGB + ACES 渲染管線：材質色一次轉 linear，與圖例 hex 對齊（不動幾何） ===== */
{const ms=new Set(); scene.traverse(o=>{if(o.isMesh){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>ms.add(m));}});
 ms.forEach(m=>{if(m.color)m.color.convertSRGBToLinear();});
 if(scene.background&&scene.background.isColor)scene.background.convertSRGBToLinear();}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
update(0); requestAnimationFrame(loop);
</script>
